name: Update download fallback

# The page fetches version/date/sizes live from the GitHub API on load, but the
# values baked into index.html are what a visitor sees when that fetch does not
# happen - no JS, a blocked API call, or a link-preview crawler (Reddit,
# Discord). Keeping them current used to be a manual step after each release,
# and it was forgotten at least once (the page said v0.11.08 after v0.11.09 was
# already out).
#
# This runs HERE rather than in the app repo's release workflow on purpose: a
# workflow can only write to its own repository with the default token, so doing
# it from there would need a cross-repo credential (a PAT, or a deploy key -
# which the org policy disables). Reading the app repo needs no credential at
# all, because it is public. So: no secrets, nothing to rotate, nothing to leak.
#
# Latency is the trade-off - up to an hour after a release. That only affects
# the audience that sees the fallback at all (no JS / crawlers), and a release
# can always trigger this immediately via the Actions tab or:
#   gh workflow run update-download-fallback.yml --repo EVERetroIndustry/everetroindustry.github.io

on:
  schedule:
    - cron: '7 * * * *'      # hourly, offset so it isn't on the crowded hour mark
  workflow_dispatch:

# Scheduled workflows are disabled after 60 days of repository inactivity. This
# job's own commits count as activity, so it keeps itself alive as long as
# releases keep changing the values; if releases stop for two months GitHub
# emails the owner rather than failing silently.

permissions:
  contents: write

concurrency:
  group: update-download-fallback
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Check out the updater script from the app repo
        uses: actions/checkout@v4
        with:
          repository: EVERetroIndustry/Eve-retroindustry
          # Public repo: readable with this repo's own token, no secret needed.
          # Only the one script is fetched - the app repo is large.
          sparse-checkout: scripts/update_website_fallback.py
          sparse-checkout-cone-mode: false
          path: app-repo

      - name: Read the latest app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh normalises the field names the script expects (tagName /
          # publishedAt), unlike the raw REST payload (tag_name / published_at).
          gh release view --repo EVERetroIndustry/Eve-retroindustry \
            --json tagName,publishedAt,assets > release.json
          python3 -c "import json;d=json.load(open('release.json'));print('latest:', d['tagName'], d['publishedAt'], len(d['assets']), 'assets')"

      - name: Rewrite the fallback values
        run: python3 app-repo/scripts/update_website_fallback.py index.html release.json

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Already current - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VER=$(python3 -c "import json;print(json.load(open('release.json'))['tagName'])")
          git commit -m "Website: refresh download fallback to $VER" -- index.html
          git push
